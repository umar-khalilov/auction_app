services:
  db-auction-container:
    container_name: db-auction-container
    image: postgres:alpine3.23
    env_file:
      - ./server/.env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      PG_DATA: /var/lib/postgresql/data
    ports:
      - ${DB_PORT}:${DB_PORT}
    volumes:
      - local_pgdata:/var/lib/postgresql/data
    networks:
      - auction-net
    tty: true
    restart: unless-stopped
  db-auction-admin-container:
    image: dpage/pgadmin4:latest
    container_name: db-auction-admin-container
    env_file:
      - ./server/.env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${DB_ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${DB_ADMIN_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - ${DB_ADMIN_PORT}:${DB_ADMIN_PORT}
    networks:
      - auction-net
    depends_on:
      - db-auction-container
    restart: unless-stopped
  node-auction-server-container:
    container_name: node-auction-server-container
    build:
      context: ./server
      dockerfile: ./Dockerfile
      target: development
    # RUN in debug mode: yarn start:debug --> Also start your debugger
    # Run in dev mode: yarn start:dev
    command: yarn start:dev
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
      - ${DEBUG_PORT}:${DEBUG_PORT}
    volumes:
      - ./server/:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db-auction-container
    networks:
      - auction-net
    restart: unless-stopped

volumes:
  local_pgdata:
    driver: local
  pgadmin-data:
    driver: local

networks:
  auction-net:
    driver: bridge
